org: glowstone
app: glowstone
service: Glow-Stone-backend

useDotenv: true

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    external:
      - pg-native

custom:
  # Shared VPC config for every DB-touching Lambda: `vpc: ${self:custom.vpc}`.
  # The RDS security group accepts this security group inbound on port 5432.
  vpc:
    securityGroupIds:
      - ${env:LAMBDA_SECURITY_GROUP_ID}
    subnetIds:
      - ${env:SUBNET_A}
      - ${env:SUBNET_B}
      - ${env:SUBNET_C}

provider:
  name: aws
  runtime: nodejs24.x
  region: ${env:AWS_REGION, 'eu-central-1'}
  stage: ${opt:stage, 'dev'}
  profile: glow-stone
  iam:
    role:
      statements:
        # Required for Lambdas that run inside a VPC.
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
          Resource: "*"
  environment:
    NODE_EXTRA_CA_CERTS: /var/runtime/ca-cert.pem
    DB_HOST: ${env:DB_HOST}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_NAME: ${env:DB_NAME}
    DB_PORT: ${env:DB_PORT}
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - http://127.0.0.1:5173
        # add the Vercel URL here once the frontend is deployed
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true
      maxAge: 86400
    payload: "2.0"
    # The Cognito JWT authorizers (customer pool, admin pool) come back with the user pools.

functions:
  # No VPC — keeps the health check's cold start fast.
  health:
    handler: src/controllers/healthController.health
    events:
      - httpApi:
          path: /
          method: GET

  listProducts:
    handler: src/controllers/productController.list
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /products
          method: GET

  getProduct:
    handler: src/controllers/productController.get
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /products/{id}
          method: GET
