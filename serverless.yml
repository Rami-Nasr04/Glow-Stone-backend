org: glowstone
app: glowstone
service: Glow-Stone-backend

useDotenv: true

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    external:
      - pg-native
      # Native module: not bundled; the resizer loads the Linux build from its layer (npm run build:sharp-layer).
      - sharp

# Externals get installed into the zip; drop them so the Windows build of sharp never ships (the layer provides it).
package:
  patterns:
    - "!node_modules/**"

custom:
  # Shared VPC config for every DB-touching Lambda: `vpc: ${self:custom.vpc}`.
  # The RDS security group accepts this security group inbound on port 5432.
  vpc:
    securityGroupIds:
      - ${env:LAMBDA_SECURITY_GROUP_ID}
    subnetIds:
      - ${env:SUBNET_A}
      - ${env:SUBNET_B}
      - ${env:SUBNET_C}

provider:
  name: aws
  runtime: nodejs24.x
  region: ${env:AWS_REGION, 'eu-central-1'}
  stage: ${opt:stage, 'dev'}
  profile: glow-stone
  # A month is enough to look into any error; after that the lines (which may hold customer details once orders exist) go.
  logRetentionInDays: 30
  iam:
    role:
      statements:
        # Required for Lambdas that run inside a VPC.
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
          Resource: "*"
        # One role for every function. The resizer and the photo routes read the masters;
        # the photo routes also write and delete them (Omar's uploads, deletes).
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${env:IMAGES_BUCKET}/products/*
        # incoming/ = the studio's uploads before they become masters (the bucket deletes leftovers after 1 day).
        # PutObject here is what lets the presigned upload form write the original.
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${env:IMAGES_BUCKET}/incoming/*
        # Lets S3 answer "not found" (404) instead of AccessDenied for a missing photo.
        - Effect: Allow
          Action: s3:ListBucket
          Resource: arn:aws:s3:::${env:IMAGES_BUCKET}
  environment:
    NODE_EXTRA_CA_CERTS: /var/runtime/ca-cert.pem
    DB_HOST: ${env:DB_HOST}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_NAME: ${env:DB_NAME}
    DB_PORT: ${env:DB_PORT}
    # The admin pool and the studio's app client (not secrets): the admin routes check every token against them.
    ADMIN_USER_POOL_ID: ${env:ADMIN_USER_POOL_ID}
    ADMIN_APP_CLIENT_ID: ${env:ADMIN_APP_CLIENT_ID}
    # The photos bucket and the CloudFront address in front of it (not secrets).
    IMAGES_BUCKET: ${env:IMAGES_BUCKET}
    CDN_URL: ${env:CDN_URL}
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - http://127.0.0.1:5173
        # vite preview of the built site
        - http://localhost:4173
        - http://127.0.0.1:4173
        # the shop and the studio (www and both vercel.app addresses redirect to these, so they never call the API)
        - https://glowstonelb.com
        - https://studio.glowstonelb.com
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true
      maxAge: 86400
    payload: "2.0"
    authorizers:
      # Lets through only tokens from the admin pool issued to the studio's app client (checked before any code runs).
      adminAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${self:provider.region}.amazonaws.com/${env:ADMIN_USER_POOL_ID}
        audience:
          - ${env:ADMIN_APP_CLIENT_ID}

layers:
  # sharp built for the Lambda's Linux arm64, by `npm run build:sharp-layer` (the folder is gitignored).
  sharp:
    path: layers/sharp
    compatibleRuntimes:
      - nodejs24.x
    compatibleArchitectures:
      - arm64

functions:
  # No VPC — keeps the health check's cold start fast.
  health:
    handler: src/controllers/healthController.health
    events:
      - httpApi:
          path: /
          method: GET

  listProducts:
    handler: src/controllers/productController.list
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /products
          method: GET

  getProduct:
    handler: src/controllers/productController.get
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /products/{id}
          method: GET

  adminListProducts:
    handler: src/controllers/adminProductController.list
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products
          method: GET
          authorizer:
            name: adminAuthorizer

  adminGetProduct:
    handler: src/controllers/adminProductController.get
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products/{id}
          method: GET
          authorizer:
            name: adminAuthorizer

  adminCreateProduct:
    handler: src/controllers/adminProductController.create
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products
          method: POST
          authorizer:
            name: adminAuthorizer

  adminUpdateProduct:
    handler: src/controllers/adminProductController.update
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products/{id}
          method: PATCH
          authorizer:
            name: adminAuthorizer

  # Photos of a piece (studio). The uploaded photo goes from the browser straight to S3 (incoming/); these
  # reach S3 from inside the VPC through the free S3 gateway endpoint.
  adminRequestPhotoUpload:
    handler: src/controllers/adminPhotoController.upload
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products/{id}/photos/upload
          method: POST
          authorizer:
            name: adminAuthorizer

  # Makes the master with sharp: arm64 for the layer, memory for a 30 MB camera photo, and just under
  # API Gateway's 30 s limit.
  adminConfirmPhoto:
    handler: src/controllers/adminPhotoUploadController.confirm
    vpc: ${self:custom.vpc}
    architecture: arm64
    memorySize: 1536
    timeout: 29
    layers:
      - Ref: SharpLambdaLayer
    events:
      - httpApi:
          path: /admin/products/{id}/photos
          method: POST
          authorizer:
            name: adminAuthorizer

  adminReorderPhotos:
    handler: src/controllers/adminPhotoController.reorder
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products/{id}/photos/order
          method: PUT
          authorizer:
            name: adminAuthorizer

  adminDeletePhoto:
    handler: src/controllers/adminPhotoController.remove
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products/{id}/photos/{imageId}
          method: DELETE
          authorizer:
            name: adminAuthorizer

  # Image resizer behind CloudFront: a Function URL (auth AWS_IAM) that only CloudFront may call, set up in the console.
  # No VPC: it only reads S3. At most 10 at once, so a flood of made-up photo names can't run up the bill
  # or take capacity from the API. Extra requests get a "too busy" error instead; cached photos are unaffected.
  resizeImage:
    handler: src/controllers/imageController.resize
    architecture: arm64
    memorySize: 1536
    timeout: 15
    reservedConcurrency: 10
    layers:
      - Ref: SharpLambdaLayer
