org: glowstone
app: glowstone
service: Glow-Stone-backend

useDotenv: true

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    external:
      - pg-native
      # Native module: not bundled; the resizer loads the Linux build from its layer (npm run build:sharp-layer).
      - sharp

# Externals get installed into the zip; drop them so the Windows build of sharp never ships (the layer provides it).
package:
  patterns:
    - "!node_modules/**"

custom:
  # Shared VPC config for every DB-touching Lambda: `vpc: ${self:custom.vpc}`.
  # The RDS security group accepts this security group inbound on port 5432.
  vpc:
    securityGroupIds:
      - ${env:LAMBDA_SECURITY_GROUP_ID}
    subnetIds:
      - ${env:SUBNET_A}
      - ${env:SUBNET_B}
      - ${env:SUBNET_C}

provider:
  name: aws
  runtime: nodejs24.x
  region: ${env:AWS_REGION, 'eu-central-1'}
  stage: ${opt:stage, 'dev'}
  profile: glow-stone
  # A month is enough to look into any error; after that the lines (which may hold customer details once orders exist) go.
  logRetentionInDays: 30
  iam:
    role:
      statements:
        # Required for Lambdas that run inside a VPC.
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
          Resource: "*"
        # One role for every function. The resizer and the photo routes read the masters;
        # the photo routes also write and delete them (Omar's uploads, deletes).
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${env:IMAGES_BUCKET}/products/*
        # incoming/ = the studio's uploads before they become masters (the bucket deletes leftovers after 1 day).
        # PutObject here is what lets the presigned upload form write the original.
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${env:IMAGES_BUCKET}/incoming/*
        # Lets S3 answer "not found" (404) instead of AccessDenied for a missing photo.
        - Effect: Allow
          Action: s3:ListBucket
          Resource: arn:aws:s3:::${env:IMAGES_BUCKET}
        # The order routes outside the VPC call the private orders function for their database part...
        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource: arn:aws:lambda:${self:provider.region}:${aws:accountId}:function:${self:service}-${sls:stage}-ordersDb
        # ...then send the order emails from the shop's verified domain only...
        - Effect: Allow
          Action: ses:SendEmail
          Resource: arn:aws:ses:${self:provider.region}:${aws:accountId}:identity/glowstonelb.com
        # ...and read the admin pool's users for the new-order alert.
        - Effect: Allow
          Action: cognito-idp:ListUsers
          Resource: arn:aws:cognito-idp:${self:provider.region}:${aws:accountId}:userpool/${env:ADMIN_USER_POOL_ID}
  environment:
    NODE_EXTRA_CA_CERTS: /var/runtime/ca-cert.pem
    DB_HOST: ${env:DB_HOST}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_NAME: ${env:DB_NAME}
    DB_PORT: ${env:DB_PORT}
    # The admin pool and the studio's app client (not secrets): the admin routes check every token against them.
    ADMIN_USER_POOL_ID: ${env:ADMIN_USER_POOL_ID}
    ADMIN_APP_CLIENT_ID: ${env:ADMIN_APP_CLIENT_ID}
    # The customer pool and the shop's app client (not secrets): the customer routes check every token against them.
    CUSTOMER_USER_POOL_ID: ${env:CUSTOMER_USER_POOL_ID}
    CUSTOMER_APP_CLIENT_ID: ${env:CUSTOMER_APP_CLIENT_ID}
    # The photos bucket and the CloudFront address in front of it (not secrets).
    IMAGES_BUCKET: ${env:IMAGES_BUCKET}
    CDN_URL: ${env:CDN_URL}
    # Order emails (not secrets): the sender, where replies go, and the links inside them.
    EMAIL_FROM: Glowstone <noreply@glowstonelb.com>
    EMAIL_REPLY_TO: glowstone216@gmail.com
    SITE_URL: https://glowstonelb.com
    STUDIO_URL: https://studio.glowstonelb.com
    ORDERS_DB_FUNCTION: ${self:service}-${sls:stage}-ordersDb
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - http://127.0.0.1:5173
        # vite preview of the built site
        - http://localhost:4173
        - http://127.0.0.1:4173
        # the shop and the studio (www and both vercel.app addresses redirect to these, so they never call the API)
        - https://glowstonelb.com
        - https://studio.glowstonelb.com
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true
      maxAge: 86400
    payload: "2.0"
    authorizers:
      # Lets through only tokens from the admin pool issued to the studio's app client (checked before any code runs).
      adminAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${self:provider.region}.amazonaws.com/${env:ADMIN_USER_POOL_ID}
        audience:
          - ${env:ADMIN_APP_CLIENT_ID}
      # The same for the shop's customers: only tokens from the customer pool issued to the shop's app client.
      customerAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${self:provider.region}.amazonaws.com/${env:CUSTOMER_USER_POOL_ID}
        audience:
          - ${env:CUSTOMER_APP_CLIENT_ID}

layers:
  # sharp built for the Lambda's Linux arm64, by `npm run build:sharp-layer` (the folder is gitignored).
  sharp:
    path: layers/sharp
    compatibleRuntimes:
      - nodejs24.x
    compatibleArchitectures:
      - arm64

functions:
  # No VPC — keeps the health check's cold start fast.
  health:
    handler: src/controllers/healthController.health
    events:
      - httpApi:
          path: /
          method: GET

  listProducts:
    handler: src/controllers/productController.list
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /products
          method: GET

  getProduct:
    handler: src/controllers/productController.get
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /products/{id}
          method: GET

  # The news list (footer, "notify me", contact form, sign-up). Public, so it is rate-limited below.
  subscribe:
    handler: src/controllers/subscriberController.create
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /subscribers
          method: POST

  # Customer pool triggers, attached to the pool in the console (Extensions). No VPC for the check: it never
  # touches the database, so sign-up stays fast.
  customerPreSignUp:
    handler: src/controllers/customerTriggerController.preSignUp

  # Post confirmation AND post authentication: makes the customers row (again on sign-in if the first try failed).
  customerSync:
    handler: src/controllers/customerTriggerController.sync
    vpc: ${self:custom.vpc}

  # Custom message: the sign-up, reset and new-email code emails in Glowstone's design. No VPC (no database).
  customerCustomMessage:
    handler: src/controllers/customerTriggerController.customMessage

  getMe:
    handler: src/controllers/customerController.me
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /me
          method: GET
          authorizer:
            name: customerAuthorizer

  # The private orders function: the database part of every order route that sends emails. No HTTP route; only
  # those routes (outside the VPC, through IAM) invoke it.
  ordersDb:
    handler: src/controllers/ordersDbController.run
    vpc: ${self:custom.vpc}
    timeout: 15

  # Orders that send emails run outside the VPC (SES and Cognito need the internet; the VPC has none, at $0) and
  # call ordersDb for the database part. Long enough for a cold ordersDb plus the emails.
  placeOrder:
    handler: src/controllers/orderActionController.place
    timeout: 25
    events:
      - httpApi:
          path: /orders
          method: POST
          authorizer:
            name: customerAuthorizer

  listMyOrders:
    handler: src/controllers/orderController.list
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /me/orders
          method: GET
          authorizer:
            name: customerAuthorizer

  getMyOrder:
    handler: src/controllers/orderController.get
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /me/orders/{id}
          method: GET
          authorizer:
            name: customerAuthorizer

  cancelMyOrder:
    handler: src/controllers/orderActionController.cancel
    timeout: 25
    events:
      - httpApi:
          path: /me/orders/{id}/cancel
          method: POST
          authorizer:
            name: customerAuthorizer

  adminListProducts:
    handler: src/controllers/adminProductController.list
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products
          method: GET
          authorizer:
            name: adminAuthorizer

  adminGetProduct:
    handler: src/controllers/adminProductController.get
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products/{id}
          method: GET
          authorizer:
            name: adminAuthorizer

  adminCreateProduct:
    handler: src/controllers/adminProductController.create
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products
          method: POST
          authorizer:
            name: adminAuthorizer

  adminUpdateProduct:
    handler: src/controllers/adminProductController.update
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products/{id}
          method: PATCH
          authorizer:
            name: adminAuthorizer

  # Drafts only; also deletes the piece's photo files (S3 through the gateway endpoint, like the photo routes).
  adminDeleteProduct:
    handler: src/controllers/adminProductController.remove
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products/{id}
          method: DELETE
          authorizer:
            name: adminAuthorizer

  # Rebuilds the shop through Vercel's deploy hook. No VPC: it needs the internet, not the database. The hook's
  # address is a secret (anyone holding it can start builds), so only this function gets it.
  adminPublish:
    handler: src/controllers/adminPublishController.publish
    # Vercel takes about 7 s to answer the hook; the service gives up at 20 s.
    timeout: 25
    environment:
      VERCEL_DEPLOY_HOOK_URL: ${env:VERCEL_DEPLOY_HOOK_URL}
    events:
      - httpApi:
          path: /admin/publish
          method: POST
          authorizer:
            name: adminAuthorizer

  # Photos of a piece (studio). The uploaded photo goes from the browser straight to S3 (incoming/); these
  # reach S3 from inside the VPC through the free S3 gateway endpoint.
  adminRequestPhotoUpload:
    handler: src/controllers/adminPhotoController.upload
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products/{id}/photos/upload
          method: POST
          authorizer:
            name: adminAuthorizer

  # Makes the master with sharp: arm64 for the layer, memory for a 30 MB camera photo, and just under
  # API Gateway's 30 s limit.
  adminConfirmPhoto:
    handler: src/controllers/adminPhotoUploadController.confirm
    vpc: ${self:custom.vpc}
    architecture: arm64
    memorySize: 1536
    timeout: 29
    layers:
      - Ref: SharpLambdaLayer
    events:
      - httpApi:
          path: /admin/products/{id}/photos
          method: POST
          authorizer:
            name: adminAuthorizer

  adminReorderPhotos:
    handler: src/controllers/adminPhotoController.reorder
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products/{id}/photos/order
          method: PUT
          authorizer:
            name: adminAuthorizer

  adminDeletePhoto:
    handler: src/controllers/adminPhotoController.remove
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/products/{id}/photos/{imageId}
          method: DELETE
          authorizer:
            name: adminAuthorizer

  # Studio orders and customers (Omar's Orders and Customers screens, and the delivery slip).
  adminListOrders:
    handler: src/controllers/adminOrderController.list
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/orders
          method: GET
          authorizer:
            name: adminAuthorizer

  adminGetOrder:
    handler: src/controllers/adminOrderController.get
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/orders/{id}
          method: GET
          authorizer:
            name: adminAuthorizer

  adminAdvanceOrder:
    handler: src/controllers/orderActionController.adminAdvance
    timeout: 25
    events:
      - httpApi:
          path: /admin/orders/{id}/status
          method: POST
          authorizer:
            name: adminAuthorizer

  adminCancelOrder:
    handler: src/controllers/orderActionController.adminCancel
    timeout: 25
    events:
      - httpApi:
          path: /admin/orders/{id}/cancel
          method: POST
          authorizer:
            name: adminAuthorizer

  adminUpdateOrder:
    handler: src/controllers/adminOrderController.update
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/orders/{id}
          method: PATCH
          authorizer:
            name: adminAuthorizer

  adminListCustomers:
    handler: src/controllers/adminOrderController.listCustomers
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/customers
          method: GET
          authorizer:
            name: adminAuthorizer

  adminGetCustomer:
    handler: src/controllers/adminOrderController.getCustomer
    vpc: ${self:custom.vpc}
    events:
      - httpApi:
          path: /admin/customers/{id}
          method: GET
          authorizer:
            name: adminAuthorizer

  # Image resizer behind CloudFront: a Function URL (auth AWS_IAM) that only CloudFront may call, set up in the console.
  # No VPC: it only reads S3. At most 10 at once, so a flood of made-up photo names can't run up the bill
  # or take capacity from the API. Extra requests get a "too busy" error instead; cached photos are unaffected.
  resizeImage:
    handler: src/controllers/imageController.resize
    architecture: arm64
    memorySize: 1536
    timeout: 15
    reservedConcurrency: 10
    layers:
      - Ref: SharpLambdaLayer

resources:
  extensions:
    # The public sign-up route accepts at most 2 requests a second (bursts of 5) from everyone together; past that,
    # API Gateway answers 429 before any code or database work runs. Plenty for real visitors; a flood of fake emails stops here.
    HttpApiStage:
      # The route must exist before the stage can hold a limit for it.
      DependsOn: HttpApiRoutePostSubscribers
      Properties:
        RouteSettings:
          "POST /subscribers":
            ThrottlingRateLimit: 2
            ThrottlingBurstLimit: 5
